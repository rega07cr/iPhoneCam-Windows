name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name iPhoneCam `
            --icon assets/icon.ico --version-file version-info.txt `
            --add-data "dashboard.html;." --add-data "phone.html;." `
            --add-data "driver/UnityCapture;driver/UnityCapture" `
            --collect-all pyvirtualcam `
            app.py

      - name: Package portable zip
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/iPhoneCam.exe, dist/README.md, dist/LICENSE `
            -DestinationPath iPhoneCam-portable.zip -Force
          (Get-FileHash dist/iPhoneCam.exe -Algorithm SHA256).Hash + '  iPhoneCam.exe' | Out-File SHA256SUMS.txt -Encoding ascii
          (Get-FileHash iPhoneCam-portable.zip -Algorithm SHA256).Hash + '  iPhoneCam-portable.zip' | Out-File SHA256SUMS.txt -Encoding ascii -Append

      - uses: actions/upload-artifact@v4
        with:
          name: iPhoneCam-windows
          path: |
            dist/iPhoneCam.exe
            iPhoneCam-portable.zip
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/iPhoneCam.exe
            iPhoneCam-portable.zip
            SHA256SUMS.txt
